services:
  postgres:
    image: postgres:16-alpine
    container_name: modaco-postgres
    environment:
      POSTGRES_USER: modaco
      POSTGRES_PASSWORD: modaco
      POSTGRES_DB: modaco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modaco"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: modaco-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: modaco-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: modaco
      MINIO_ROOT_PASSWORD: modaco123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
